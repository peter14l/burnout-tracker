name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version code'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Decode google-services.json
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        else
          echo "No google-services.json found, creating placeholder"
          cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "firebase_url": "https://mock-project.firebaseio.com",
            "project_id": "mock-project",
            "storage_bucket": "mock-project.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.burnouttracker"
                }
              },
              "api_key": [{"current_key": "mock-api-key"}],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi
    
    - name: Build release AAB
      run: ./gradlew bundleRelease
    
    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
        packageName: com.burnouttracker.app
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: internal
